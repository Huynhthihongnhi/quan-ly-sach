# Reverse proxy template for S7-02 (Ubuntu 24.04 LTS, intranet/VPN only per D10).
# TLS-terminating reverse proxy in front of the api service. The api container is the only
# place that can read the digital-asset storage volume (see compose.prod.yml: the storage
# volume is mounted into api/worker only, never into this proxy container), so there is no
# static path here that could ever expose it; the explicit deny below is defense in depth,
# not the only control.
#
# Certs: for a real school-network deployment, use an internal CA or a certificate issued for
# the intranet hostname. For local smoke-testing this config, generate a throwaway self-signed
# pair (never commit real certificate/key material):
#   openssl req -x509 -newkey rsa:2048 -nodes -days 30 \
#     -keyout docker/proxy/certs/server.key -out docker/proxy/certs/server.crt \
#     -subj "/CN=library.internal.example"

server {
    listen 80;
    server_name library.internal.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name library.internal.example;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # Defense in depth: never serve the digital-asset storage root as a static path, even
    # though this container has no filesystem access to it (see comment above).
    location /storage/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Requested-With $http_x_requested_with;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
        proxy_cookie_flags ~ secure;
    }

    # Only the liveness probe is exposed publicly. /health/ready is deliberately not proxied:
    # compose.prod.yml's own api healthcheck already calls it from inside the container
    # (127.0.0.1:3000), and its 503 body can name the unavailable dependency (e.g. "Circulation
    # schema is not available"), which an anonymous intranet caller does not need to see.
    location = /health/live {
        proxy_pass http://api:3000/health/live;
        proxy_set_header Host $host;
        access_log off;
    }

    # Placeholder for the CMS production build: mount its static output here as a read-only
    # bind volume when the CMS build/deploy pipeline is defined. Not part of S7-02's file
    # scope (BE/docker/), which covers only the API/worker/mysql/proxy stack.
    location / {
        return 404;
    }
}
